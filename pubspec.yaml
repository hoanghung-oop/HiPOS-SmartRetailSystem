name: app_quan_ly_ban_hang
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3 # Thêm Firestore
  google_generative_ai: ^0.4.3 # Thêm Gemini AI cho Chatbot

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  shared_preferences: ^2.5.6
  simple_barcode_scanner: ^0.4.0
  image_picker: ^1.2.1
  fl_chart: ^1.1.1

  speech_to_text: ^7.5.0
  flutter_dotenv: ^6.0.1
  firebase_storage: ^13.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - env.txt
    - assets/icons/

# --- CẤU HÌNH ICON ỨNG DỤNG ---
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon.png"
  image_path: "assets/icons/app_icon.png"
  # Dành cho Android 8.0 trở lên (Adaptive Icon):
  adaptive_icon_background: "#FFFFFF" # Màu nền icon (hoặc đường dẫn ảnh nền)
  adaptive_icon_foreground: "assets/icons/app_icon.png"

# --- CẤU HÌNH MÀN HÌNH CHỜ (SPLASH SCREEN) ---
flutter_native_splash:
  color: "#FFFFFF" # Màu nền khi mở app (màu trắng hoặc mã màu chủ đạo của app)
  image: assets/icons/splash_logo.png # Logo nằm giữa màn hình
  android_12:
    image: assets/icons/splash_logo.png
    icon_background_color: "#FFFFFF"
  web: false

